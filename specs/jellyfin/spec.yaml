name: Jellyfin
tagline: Jellyfin is a Free Software Media System that puts you in control of managing and streaming your media.
url: https://jellyfin.org/
spdx_license: GPL-2.0-only
license_url: https://github.com/jellyfin/jellyfin/blob/master/LICENSE
tags:
  - entertainment
  - video
template: |-
  services:
    jellyfin:
      image: {{ .Values.image | quote }}
      container_name: jellyfin
      {{- if .Values.user_id}}
      user: {{.Values.user_id | quote}}
      {{- end}}
      ports:
        - "{{.Values.http_port}}:8096/tcp"
        {{- if .enable_autodiscovery}}
        - 7359:7359/udp
        {{- end}}
      volumes:
        - {{.Values.config_path}}:/config
        - {{.Values.cache_path}}:/cache
        - type: tmpfs
          target: /media
        {{- $media := trim (default "" .media_paths) }}
        {{- if $media }}
        {{- range $i, $path := split $media "\n" }}
        - type: bind
          source: {{trim $path}}
          target: /media/{{$i}}
        {{- end}}
        {{- end}}
        {{- if .Values.fonts_path}}
        - type: bind
          source: {{.Values.fonts_path}}
          target: /usr/local/share/fonts/custom
          read_only: true
        {{- end}}
      restart: unless-stopped
      {{- if .Values.published_server_url}}
      environment:
        - JELLYFIN_PublishedServerUrl={{.Values.published_server_url}}
      {{- end}}
      {{- if .Values.enable_extra_hosts}}
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      {{- end}}
form:
  - select:
      keyname: image
      label: Image
      description: Container image to use.
      default_value: jellyfin/jellyfin:latest
      options:
        - title: jellyfin/jellyfin:latest
          value: jellyfin/jellyfin:latest
  - number:
      keyname: http_port
      label: Web UI Port
      description: The host port Jellyfin's web interface should be served on.
      default_value: 8096
      minimum: 1
      maximum: 65535
      step: 1
  - string:
      keyname: config_path
      label: Config Path
      description: Host directory for Jellyfin's configuration and metadata.
      default_value: ./config
  - string:
      keyname: cache_path
      label: Cache Path
      description: Host directory for Jellyfin's transcoding and image cache.
      default_value: ./cache
  - text:
      keyname: media_paths
      label: Media Paths
      description: Host directories containing your media libraries, one per line.
      help_text: |-
        Each line is mounted read-write inside the container at `/media/0`,
        `/media/1`, and so on in the order listed.
      placeholder: |-
        /path/to/movies
        /path/to/tv
  - collapsible:
      title: Advanced
      form:
        - string:
            keyname: user_id
            label: User/Group ID
            description: Run Jellyfin as this uid:gid instead of root.
            help_text: For example `1000:1000`. Leave blank to run as root.
            placeholder: "1000:1000"
        - string:
            keyname: fonts_path
            label: Custom Fonts Path
            description: Extra fonts to be used during transcoding with subtitle burn-in, mounted read-only at `/usr/local/share/fonts/custom`.
            placeholder: /path/to/fonts
        - toggle:
            keyname: enable_autodiscovery
            label: Enable Autodiscovery
            description: Publish UDP port 7359 so clients on the local network can automatically find this server.
            default_value: true
        - string:
            keyname: published_server_url
            label: Published Server URL
            description: Alternative address advertised to clients during autodiscovery.
            help_text: Useful when Jellyfin is reachable through a reverse proxy or a different hostname/port than the LAN address.
            placeholder: http://example.com
        - toggle:
            keyname: enable_extra_hosts
            label: Add host-gateway Extra Host
            description: Adds a `host.docker.internal` entry pointing at the Docker host.
            help_text: May be necessary for the Docker healthcheck to pass when running in host network mode.
