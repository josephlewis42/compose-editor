version: v2
plugins:
  # - local: protoc-gen-go
  #   out: pkg/proto
  #   opt:
  #     - paths=source_relative
  - local: frontend/node_modules/.bin/protoc-gen-es
    out: frontend/src/gen
    opt:
      - target=ts
  - local:
    - go
    - tool
    - github.com/aperturerobotics/protobuf-go-lite/cmd/protoc-gen-go-lite
    out: pkg/proto
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+equal+clone+text+json
